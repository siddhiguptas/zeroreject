version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: zeroreject_api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - GOV_PORTAL_BASE_URL=http://gov_portal:8090
      - PLAYWRIGHT_HEADLESS=true
      - DATABASE_URL=sqlite+aiosqlite:///./zeroreject.db
    volumes:
      - ./storage:/app/storage
      - ./zeroreject.db:/app/zeroreject.db

  gov_portal:
    build:
      context: .
      dockerfile: Dockerfile.gov
    container_name: zeroreject_gov_portal
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - GOV_PORTAL_HOST=0.0.0.0
      - GOV_PORTAL_PORT=8090

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
        - NEXT_PUBLIC_GOV_PORTAL_URL=http://localhost:8090
    container_name: zeroreject_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
      - gov_portal
